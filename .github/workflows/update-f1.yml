name: Auto-Update Taras F1 Static API

on:
  schedule:
    # Run every Monday at 02:00 UTC (after race weekends)
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allows manual trigger directly from GitHub Actions tab

jobs:
  update-api:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Configure Git Committer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Execute Taras F1 API v2 Master Pipeline
        run: |
          python run_v2.py --skip-scrape --no-push

      - name: Verify 100% Data Integrity
        run: |
          python v2/test_v2_integrity.py

      - name: Deploy Updated Static Endpoints to GitHub Pages
        run: |
          git add v1/ v2/ docs/ index.html
          if git diff --cached --quiet; then
            echo "No data changes detected. Working tree clean."
          else
            git commit -m "Auto-update Taras F1 API v2 data [skip ci]"
            git push origin main
          fi
